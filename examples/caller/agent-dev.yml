# TEMPLATE: copy to .github/workflows/ and change the lines marked CHANGE.
# Dev agent: nightly on agent:ready issues, on demand, or when you label an issue agent:urgent.
#   One issue now:         gh workflow run agent-dev.yml -f issue=42
#   The nightly selection: gh workflow run agent-dev.yml -f mode=scheduled
name: agent-dev
on:
  # GitHub's schedule is best effort and can start hours late or not at all. If it does on
  # your repo, delete this block and start the run from outside with mode=scheduled
  # (see worker/ in tonhe/agent-loop). Do not keep both, or a late run doubles up.
  schedule:
    - cron: '17 7 * * *'   # ~2:17 AM Eastern
  workflow_dispatch:
    inputs:
      mode:
        description: "scheduled = the nightly selection; manual and urgent need an issue number"
        type: choice
        options: [manual, scheduled, urgent]
        default: manual
      issue: {description: "Issue number (manual and urgent only)", required: false}
  issues:
    types: [labeled]
permissions:
  contents: read
  issues: read
  actions: read   # the nightly run looks for an unfinished backlog run and waits for it
# Label events other than agent:urgent get their own throwaway group, so they can never
# displace a queued nightly or urgent run.
concurrency:
  group: ${{ (github.event_name == 'issues' && github.event.label.name != 'agent:urgent') && format('agent-dev-noop-{0}', github.run_id) || 'agent-dev' }}
  cancel-in-progress: false
jobs:
  dev:
    if: github.event_name != 'issues' || github.event.label.name == 'agent:urgent'
    uses: tonhe/agent-loop/.github/workflows/dev.yml@v1
    with:
      loop_ref: v1
      # The schedule runs the nightly selection, a label event is urgent, and a manual start
      # runs in the mode it names. The nightly selection ignores any issue number.
      mode: ${{ github.event_name == 'schedule' && 'scheduled' || (github.event_name == 'issues' && 'urgent' || github.event.inputs.mode || 'manual') }}
      issue: ${{ github.event.inputs.mode != 'scheduled' && (github.event.inputs.issue || github.event.issue.number) || '' }}
      owner_login: tonhe                 # CHANGE: your GitHub login
      git_author_name: tonhe             # CHANGE: commit author name
      git_author_email: you@example.com   # CHANGE: an email linked to your GitHub account
      verify_command: make test-all     # CHANGE: command that proves a change works
      go_version_file: go.mod          # CHANGE: drop for non-Go; use setup_command
      # selection_order: type          # optional: bugs, then tech-debt, upkeep, features (default: oldest)
      # backlog_workflow: triage.yml   # optional: your backlog workflow file, if not agent-backlog.yml
      # backlog_wait_minutes: 0        # optional: nightly runs wait up to 15 min for a backlog run; 0 = never
      bash_allow: >-
        Bash(go build:*),Bash(go test:*),Bash(go vet:*),Bash(gofmt:*),Bash(go mod tidy),
        Bash(make build),Bash(make test),Bash(make test-race),Bash(make test-tui),
        Bash(make test-all),Bash(make coverage-gate),Bash(make golden-update)
      protected_paths: |
        Makefile
        scripts/
        .goreleaser.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      AGENT_PAT: ${{ secrets.AGENT_PAT }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
