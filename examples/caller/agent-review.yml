# TEMPLATE: copy to .github/workflows/ and change the lines marked CHANGE.
# Claude review of your PRs. Require the check "review / agent-review" in the main ruleset.
# The dev agent's PRs (branch issue-N) get a blocking review. Your own PRs get an advisory
# one: a single comment, updated on every push, and the check always passes. Each push to
# one of your PRs costs at least one Claude call. See "Review modes" in the agent-loop README.
name: agent-review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  issues: read
  pull-requests: write
concurrency: {group: "agent-review-${{ github.event.pull_request.number }}", cancel-in-progress: true}
jobs:
  review:
    uses: tonhe/agent-loop/.github/workflows/review.yml@v1
    with:
      loop_ref: v1
      owner_login: tonhe                 # CHANGE: your GitHub login
      verify_command: make test-all     # CHANGE: command that proves a change works
      platforms: Linux, macOS, and Windows
      # Optional: files an agent PR may only change after you comment "Owner decision ..."
      # on its issue. See "Protected by instruction" in the agent-loop README.
      # protected_review_paths: |
      #   internal/probe/family.go
      #   internal/sysprobe/**
      # Optional: when a large PR is reviewed in several Claude calls, and how many.
      # split_max_files: 40
      # split_max_lines: 3000
      # split_max_calls: 8
      # split_max_diff_bytes: 300000
      # job_timeout_minutes: 120
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
